<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terima Kasih</title>

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #dfe9f3, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
    }

    .box {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        border: 1px solid #e6e6e6;
        max-width: 420px;
    }

    h2 {
        font-size: 26px;
        color: #333;
        margin-bottom: 10px;
    }

    p {
        font-size: 16px;
        color: #555;
        margin-top: 10px;
    }

    a {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 20px;
        background: #4CAF50;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
    }

    a:hover {
        background: #3e8e41;
    }
</style>

</head>
<body>

<div class="box">
    <h2>Terima Kasih!</h2>
    <p>Formulir kamu sudah terkirim.  
    Silakan tunggu konfirmasi dari panitia OSIS.</p>

    <a href="index.html">Kembali ke Beranda</a>
</div>

</body>
</html>
