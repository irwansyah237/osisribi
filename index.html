  <!-- Minimal JS for carousel and behavior -->
  <script>
    (function(){
      const slideEls = Array.from(document.querySelectorAll('.carousel .slide'));
      const dotsEl = document.getElementById('dots');
      const carousel = document.getElementById('carousel');
      let current = 0;
      let interval = null;
      const INTERVAL_MS = 3500;

      // lazy load images from data-src
      slideEls.forEach((img,i)=>{ img.src = img.dataset.src; });

      // create dots
      slideEls.forEach((s, i)=>{
        const b = document.createElement('button');
        b.setAttribute('aria-label', 'Slide '+(i+1));
        if(i===0) b.classList.add('active');
        b.addEventListener('click', ()=>{ goTo(i); restart(); });
        dotsEl.appendChild(b);
      });

      function setActive(index){
        slideEls.forEach((img,i)=> img.classList.toggle('active', i===index));
        Array.from(dotsEl.children).forEach((d,i)=> d.classList.toggle('active', i===index));
      }

      function goTo(i){ current = (i+slideEls.length) % slideEls.length; setActive(current); }
      function next(){ goTo(current+1); }

      function start(){ interval = setInterval(next, INTERVAL_MS); }
      function stop(){ clearInterval(interval); interval=null; }
      function restart(){ stop(); start(); }

      // start autoplay when visible
      start();

      // pause on hover for accessibility
      carousel.addEventListener('mouseenter', stop);
      carousel.addEventListener('mouseleave', start);

      // keyboard navigation
      document.addEventListener('keydown', (e)=>{
        if(e.key==='ArrowLeft') { goTo(current-1); restart(); }
        if(e.key==='ArrowRight') { goTo(current+1); restart(); }
      });

      // Example: if you want to change instagram link dynamically, set a new href here
      // document.getElementById('instagramLink').href = 'https://instagram.com/yourpage';

      // Make carousel accessible: announce slide changes
      let liveRegion = document.createElement('div');
      liveRegion.setAttribute('aria-live','polite');
      liveRegion.style.position='absolute'; liveRegion.style.left='-9999px';
      document.body.appendChild(liveRegion);
      setInterval(()=>{ liveRegion.textContent = 'Slide '+(current+1)+' dari '+slideEls.length; }, 1200);

    })();
  </script>
